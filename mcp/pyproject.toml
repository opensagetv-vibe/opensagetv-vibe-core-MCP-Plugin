[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opensagetv-vibe-core-mcp"
version = "0.1.4"
description = "MCP adapter for the stock-compatible OpenSageTV Vibe Core Control Bridge"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "OpenSageTV Vibe contributors" }]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
  "mcp[cli]==2.1.1",
  "tomli==2.4.1; python_version < '3.11'",
]

[project.scripts]
opensagetv-vibe-core-mcp = "opensagetv_vibe_core_mcp.server:main"

[project.urls]
Homepage = "https://github.com/opensagetv-vibe/opensagetv-vibe-core-MCP-Plugin"
Repository = "https://github.com/opensagetv-vibe/opensagetv-vibe-core-MCP-Plugin"
Issues = "https://github.com/opensagetv-vibe/opensagetv-vibe-core-MCP-Plugin/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/opensagetv_vibe_core_mcp"]
